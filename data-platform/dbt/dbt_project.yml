# dbt project config. dbt reads this to know where models live, how to name
# schemas, and how each layer should be materialized.
name: 'vesselmind'
version: '1.0.0'
config-version: 2

# Which profile (connection) to use — defined in profiles.yml next to this file.
profile: 'vesselmind'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  vesselmind:
    silver:
      # Silver is materialized as a real TABLE (not a view) so the cleaned data
      # is physically stored and fast to query from gold and the dashboard.
      +schema: silver
      +materialized: table
    gold:
      # Gold — the star schema and business aggregates the dashboard reads.
      +schema: gold
      +materialized: table

seeds:
  vesselmind:
    # Reference data maintained by hand and version-controlled, as opposed to
    # anything derived from the AIS feed. Its own schema so nothing confuses a
    # declared fact ("fleet X owns this vessel") with an observed one.
    +schema: reference
    vessel_fleet_registry:
      # Pinned rather than inferred. MMSI is TEXT throughout this warehouse
      # (silver keeps it as an identifier, not a quantity), and an inferred
      # integer column would join to nothing — every owned vessel would silently
      # fall through to "public". Pinning also lets a header-only file build an
      # empty table instead of failing type inference.
      +column_types:
        mmsi: varchar
        fleet_id: varchar

# Tunable business logic for the idling model (override with --vars if needed).
vars:
  idle_speed_knots: 0.5    # at/below this speed a ping counts as "idle"
  idle_min_minutes: 30     # an idle run must last this long to count as an episode
  idle_max_gap_minutes: 45 # a gap in reporting longer than this ends an idle run, rather than
                           # letting one episode span the silence (see gold_vessel_idling)
  max_plausible_knots: 50  # speed sanity bound: silver nulls any SOG above it (the AIS "not available"
                           # sentinel is 102.3), and fct_vessel_daily drops legs implying a faster speed
                           # as GPS teleports
