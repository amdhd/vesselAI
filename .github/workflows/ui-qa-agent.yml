name: UI QA agent

# THE HUMAN-TRIGGERED path into the browser-QA run: a maintainer labels a PR, a
# maintainer dispatches a run, or the weekly cron sweeps main. Advisory by
# design -- its verdict is a PR comment and a check nobody's merge waits on.
#
# The run itself lives in qa-run.yml, which this file now calls. It moved there
# so the reconcile gate can invoke the SAME implementation rather than a copy:
# two browser-QA implementations would drift, and the one that drifted would be
# the one deciding whether an agent's fix is allowed to merge.
#
# THE MACHINE-ENFORCED path is qa-reconcile-gate.yml. It calls qa-run.yml with
# fail_on_findings: false and renders the required `Reconcile gate` check from
# the verdict. Nothing about that path is triggered from here.

on:
  # Manual: the only path that may point at a REAL AI key.
  workflow_dispatch:
    inputs:
      model:
        description: Bedrock inference profile (blank = cheap rung)
        required: false
        type: string
      max_routes:
        description: Cap on routes explored
        required: false
        default: "8"
        type: string
      live_ai:
        description: Use a real ANTHROPIC_API_KEY (costs money)
        required: false
        default: false
        type: boolean

  # A cron carries no label, so it is the one trigger that can bill unattended.
  # Gated on the QA_SCHEDULE_ENABLED repo variable, default off.
  schedule:
    - cron: "0 3 * * 1"

  # paths: keeps the agent off docs-only PRs. data-platform, k8s, terraform and
  # frontend-angular cannot affect the React UI under test.
  #
  # NOTE the asymmetry with qa-reconcile-gate.yml, which has NO paths filter.
  # That is not an oversight there: a required status check must report on every
  # PR to the branch or the merge stalls forever waiting for a run that a path
  # filter quietly declined to start. This file is advisory, so it can afford to
  # be selective; the gate cannot.
  pull_request:
    # types MUST be declared. The default is opened/synchronize/reopened, which
    # does NOT include `labeled` -- so adding agent-qa to an existing PR did
    # nothing, and the label 1d calls the single most effective cost control
    # could not actually start a run. Confirmed the hard way: PR #95 was opened
    # WITH the label and the job was SKIPPED, because the label lands a moment
    # after the `opened` payload is built. A skipped job is green, so it reads
    # as "the agent found nothing" rather than "the agent never ran".
    #
    # `labeled` fires on ANY label; the contains(...'agent-qa') guard on the job
    # is what keeps an unrelated label from starting a paid run.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ui-qa-agent.yml"
      - ".github/workflows/qa-run.yml"

# Least privilege at the GitHub layer. pull-requests: write is for the findings
# comment and is the only write scope; note it does NOT grant push.
#
# These must be declared HERE as well as in qa-run.yml: a called workflow's
# token is the intersection of the two, so a caller that grants less silently
# starves the run of what it needs.
permissions:
  id-token: write
  contents: read
  pull-requests: write

# event_name is in the key deliberately: schedule and workflow_dispatch both
# present refs/heads/main, so keying on ref alone would let a manual run cancel
# a regression sweep mid-session. With cancel-in-progress that kills a paid
# AgentCore session for nothing.
concurrency:
  group: ui-qa-agent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Browser QA
    uses: ./.github/workflows/qa-run.yml
    # inherit, not an explicit map. The only secret the run needs is
    # ANTHROPIC_API_KEY, and a fork PR is handed no secrets at all regardless of
    # what is written here -- the guard below is what keeps a fork away from the
    # run, not this line.
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    # THE FORK GUARD. This is the control that keeps a fork PR away from AWS
    # credentials, and it is not optional.
    #
    # The IAM trust policy CANNOT do it: GitHub mints the token with
    # sub = repo:amdhd/vesselAI:pull_request for fork and same-repo PRs alike,
    # so the enumerated subject list cannot tell them apart. GitHub currently
    # caps fork-PR permissions at read on a public repo, so id-token: write is
    # never granted -- but that is a platform default, not our control, and the
    # admin setting that lifts it applies to private repos.
    #
    # The label gate below helps (a fork author cannot self-label) but collapses
    # the moment a maintainer labels a fork PR to review it, which is the normal
    # thing to do. So: an explicit guard.
    if: >-
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.fork == false &&
         contains(github.event.pull_request.labels.*.name, 'agent-qa'))) &&
      (github.event_name != 'schedule' || vars.QA_SCHEDULE_ENABLED == 'true')

    with:
      # format() rather than a bare interpolation: the input is typed string and
      # pull_request.number is a number, and on schedule/dispatch there is no
      # pull_request at all -- so this resolves to "" and the run stays
      # run-scoped, never archiving under a pr- alias.
      pr_number: ${{ github.event.pull_request.number != '' && format('{0}', github.event.pull_request.number) || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      model: ${{ inputs.model || '' }}
      max_routes: ${{ inputs.max_routes || '8' }}
      live_ai: ${{ inputs.live_ai == true }}
      # TRUE here, and that is this path's existing behaviour preserved: a
      # blocking finding fails the QA check directly. Only the reconcile gate
      # needs the verdict handed back instead.
      fail_on_findings: true
