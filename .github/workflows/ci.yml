name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token: this pipeline only needs to read the repo.
permissions:
  contents: read
  # Required to push images to GHCR. Scoped here at the workflow level and
  # narrowed further on the publish job itself — the test jobs never need it.
  packages: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Ephemeral Postgres used to prove the migration chain applies cleanly.
      # The test step deliberately runs WITHOUT DATABASE_URL (see below), so the
      # service does not need to persist anything between steps.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vesselmind
          POSTGRES_PASSWORD: vesselmind_secret
          POSTGRES_DB: vesselmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vesselmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (validate the migration chain on fresh Postgres)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://vesselmind:vesselmind_secret@localhost:5432/vesselmind_test

      - name: Typecheck
        run: npx tsc --noEmit

      # NOTE: no DATABASE_URL here on purpose. The integration suite exercises
      # the app's DB-unreachable graceful-degradation paths (503 / demo-cred
      # fallback), which require Prisma to have no reachable DB. Pointing these
      # tests at the Postgres service above would flip those assertions.
      - name: Test
        run: npm test

  frontend:
    name: Frontend — typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck + build
        run: npm run build

  angular:
    name: Angular — test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22's CLI requires Node >= 24.15 (the other jobs pin 20);
          # setup-node resolves "24" to the latest 24.x, which satisfies it.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - run: npm ci

      # Vitest-based unit-test builder (Angular 22 default). --watch=false so the
      # runner exits instead of watching. `npm run build` runs `ng build`, which
      # includes the strict-template typecheck.
      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  data-platform:
    name: Data platform — pipeline + dbt tests + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 to match requirements.txt: dbt-core has no wheels for the
          # newest Python, so the whole toolchain is pinned to it.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            data-platform/requirements.txt
            data-platform/api/requirements.txt
            data-platform/requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r api/requirements.txt -r requirements-dev.txt

      # The warehouse itself is gitignored (regenerated, never committed), but
      # data/raw/ais_sample.csv is tracked precisely so the pipeline can be
      # rebuilt from scratch here. This step proves that still works.
      - name: Load bronze (raw CSV -> DuckDB)
        run: python ingestion/load_bronze.py

      # `dbt build` = run + test interleaved, so a model's tests run right after
      # it builds and a failure stops its dependents. This covers the silver/gold
      # transforms plus the schema tests and the singular assert_* tests.
      - name: dbt build (silver + gold, with data tests)
        working-directory: data-platform/dbt
        run: dbt build --profiles-dir .

      - name: API auth tests
        # Set explicitly so the suite tests a known secret rather than depending
        # on main.py's dev-only fallback, which exists for local convenience.
        env:
          JWT_SECRET: ci-test-secret
        run: pytest api/test_auth.py

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. The point is that a broken Dockerfile
      # fails the PR instead of surfacing at deploy time. Both the dev and prod
      # images are built because they diverge (prod is multi-stage, non-root).
      # Layer cache is scoped per image so the four builds don't evict each other.
      - name: Backend (dev)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Backend (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Frontend (dev)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev

      - name: Frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          # VITE_API_URL is baked into the bundle at build time; the default
          # (/api, same-origin behind the nginx proxy) is what prod deploys use.
          # VITE_ANALYTICS_API_URL defaults to / for the same reason.
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      # Also exercises the pipeline: this image's build stage runs
      # load_bronze + `dbt build` to bake the warehouse in, so a broken
      # transform or a failing data test fails the image build here.
      - name: Analytics API (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./data-platform
          file: ./data-platform/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=analytics-prod
          cache-to: type=gha,mode=max,scope=analytics-prod

  # ---------------------------------------------------------------------------
  # Build, scan and publish the API image.
  #
  # WHY THIS EXISTS: before this job, images reached the cluster via
  # `k3d image import` — copying a tarball in by hand. That has no equivalent
  # outside a laptop. Real clusters pull from a registry, so CI has to produce
  # one.
  #
  # ON PULL REQUESTS the image is built and scanned but NOT pushed: a PR must
  # not be able to publish an artifact, and its diff has not been reviewed yet.
  # Pushing happens only on merge to main.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Build, scan and publish the runtime images.
  #
  # WHY THIS EXISTS: before this job, images reached the cluster via
  # `k3d image import` — copying a tarball in by hand, which has no equivalent
  # outside a laptop. Real clusters pull from a registry, so CI has to produce
  # one.
  #
  # A MATRIX, so every shipped image passes the same gate. The frontend was
  # originally scanned only on a laptop, which meant a base image could rot
  # between manual checks and nothing would catch it. A gate that covers one of
  # two images is not a gate.
  #
  # ON PULL REQUESTS images are built and scanned but NOT pushed: a PR must not
  # be able to publish an artifact, and its diff has not been reviewed yet.
  # Pushing happens only on merge to main.
  #
  # fail-fast: false so one image's vulnerabilities do not hide the other's.
  # ---------------------------------------------------------------------------
  publish-images:
    name: ${{ matrix.name }} image — build, scan, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Required for the OIDC handshake with AWS. Without it,
      # configure-aws-credentials cannot mint a token and the ECR push fails
      # with a confusing "Could not load credentials" rather than a permissions
      # error. Scoped to this job only — no other job needs to assume a role.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image: vesselai-api
          - name: Web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image: vesselai-web
          - name: Analytics
            context: ./data-platform
            dockerfile: ./data-platform/Dockerfile.prod
            image: vesselai-analytics
            trivyignore: ./data-platform/.trivyignore
          # The two BUILD-STAGE images. These were never published, so the
          # migration Job and the warehouse CronJob referenced images that
          # existed only in a local k3d registry — meaning those two workloads
          # would ImagePullBackOff on any real cluster. They carry tooling the
          # runtime images deliberately prune (ts-node, the dbt toolchain), which
          # is why they cannot simply reuse the runtime image.
          - name: Migrate
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            # `migrate`, not `build`: same contents minus npm, whose vendored
            # dependency tree accounts for every HIGH/CRITICAL in that stage.
            target: migrate
            image: vesselai-migrate
          - name: Warehouse builder
            context: ./data-platform
            dockerfile: ./data-platform/Dockerfile.prod
            target: build
            image: vesselai-warehouse-builder
            trivyignore: ./data-platform/.trivyignore
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, load into the local daemon so the scanner can read it. The
      # push reuses this build via the layer cache, so the image that is scanned
      # is the image that is published — not a rebuild that might differ.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Empty for the runtime images (build the final stage); `build` for the
          # two images that intentionally stop at an earlier stage.
          target: ${{ matrix.target || '' }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Pinned to a commit SHA, not a tag. A third-party action runs arbitrary
      # code with access to this job's token; a mutable tag can be repointed at
      # new code after review. The SHA cannot. (v0.36.0 at time of pinning.)
      #
      # ignore-unfixed is deliberate: a CRITICAL with no available patch is not
      # something this pipeline can act on, and failing on it trains everyone to
      # ignore the scanner — the worst outcome for a security gate. Unfixable
      # findings still appear in the job log.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Per-image suppression file, where one exists. Each entry in it carries
          # a justification and a re-check date — a .trivyignore without those is
          # indistinguishable from switching the scanner off.
          trivyignores: ${{ matrix.trivyignore || '' }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA, never :latest.
      #
      # An immutable tag means a running pod's image names the exact commit that
      # built it, and a rollback is "deploy the previous SHA" rather than "hope
      # the registry still has what :latest used to point at". :latest is a
      # moving target: two pods on the same tag can run different code with no
      # way to tell which from the manifest.
      #
      # The `main` tag is published alongside purely as a human convenience for
      # "what is current" — nothing should ever deploy from it.
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}

      # -----------------------------------------------------------------------
      # ECR, for the EKS cluster.
      #
      # GUARDED ON A REPO VARIABLE, and this is not defensiveness for its own
      # sake. The ECR repositories are created and destroyed with the cluster
      # (terraform destroy owns them), so for most of this repo's life there is
      # nothing to push to. An unconditional push would fail every merge to main
      # whenever the burst cluster is down — training everyone to ignore a red
      # pipeline, which is the worst outcome for a gate.
      #
      # So: set AWS_ECR_ROLE_ARN (repo variable, from `terraform output
      # github_actions_ecr_role_arn`) when the cluster is up; unset it after
      # `make destroy`. GHCR is the always-available registry and is unaffected.
      #
      # NO STORED AWS CREDENTIALS. The role is assumed via GitHub's OIDC
      # provider, trusted by IAM in terraform/github-oidc.tf and pinned to this
      # repository AND refs/heads/main — so a pull request from a fork cannot
      # obtain it even by editing this file.
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ECR_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ONE TAG ONLY, unlike the GHCR push above. The ECR repositories are
      # IMMUTABLE (terraform/ecr.tf), so pushing a second, moving `:main` tag
      # would succeed once and then fail on every subsequent merge. The SHA tag
      # is the one that matters anyway — it is what the prod overlay resolves to
      # a digest and pins.
      - name: Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ECR_ROLE_ARN != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/vesselmind/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # Static validation of the Kubernetes manifests.
  #
  # Catches a class of bug that does NOT fail at apply time: a ResourceQuota
  # smaller than the workloads' peak demand. The manifests apply cleanly, and the
  # failure surfaces later as an HPA reporting desired: N while the ReplicaSet
  # emits FailedCreate "exceeded quota" and pods never appear — which looks like
  # the autoscaler working. Arithmetic in CI is far cheaper than that at 2am.
  # ---------------------------------------------------------------------------
  k8s-manifests:
    name: Kubernetes manifests — render + quota headroom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --no-cache-dir pyyaml

      # kubectl ships kustomize, so no extra tool is needed. Rendering is itself
      # a test: a broken patch (a JSON `replace` against a path that no longer
      # exists, say) fails here rather than on a cluster.
      - name: Render overlays and check quota headroom
        run: |
          set -euo pipefail
          for overlay in dev prod; do
            echo "::group::$overlay"
            kubectl kustomize "k8s/overlays/$overlay" > "/tmp/$overlay.yaml"
            python3 k8s/scripts/check-quota-headroom.py "$overlay" < "/tmp/$overlay.yaml"
            echo "::endgroup::"
          done

      # Catches two things that only surface at deploy time and look like
      # infrastructure faults rather than manifest faults: an image that does not
      # exist anywhere (ImagePullBackOff, which reads as a networking or
      # credentials problem), and a mutable tag in production, where two nodes
      # pulling the same tag can get different bytes.
      #
      # --require-digest applies to prod only. Dev points at a local k3d registry
      # that CI cannot reach; those references are reported as SKIP rather than
      # passed silently, because "could not verify" and "verified good" must not
      # look the same.
      #
      # Registry rate limits (HTTP 429) are treated as SKIP, not failure — a
      # check that goes red on throttling teaches people to re-run until green,
      # which is worse than not checking.
      - name: Verify image references resolve
        run: |
          set -euo pipefail
          echo "::group::prod"
          python3 k8s/scripts/check-image-refs.py prod --require-digest < /tmp/prod.yaml
          echo "::endgroup::"
          echo "::group::dev"
          python3 k8s/scripts/check-image-refs.py dev < /tmp/dev.yaml
          echo "::endgroup::"
