name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token: this pipeline only needs to read the repo.
permissions:
  contents: read
  # Required to push images to GHCR. Scoped here at the workflow level and
  # narrowed further on the publish job itself — the test jobs never need it.
  packages: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Ephemeral Postgres used to prove the migration chain applies cleanly.
      # The test step deliberately runs WITHOUT DATABASE_URL (see below), so the
      # service does not need to persist anything between steps.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vesselmind
          POSTGRES_PASSWORD: vesselmind_secret
          POSTGRES_DB: vesselmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vesselmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (validate the migration chain on fresh Postgres)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://vesselmind:vesselmind_secret@localhost:5432/vesselmind_test

      - name: Typecheck
        run: npx tsc --noEmit

      # NOTE: no DATABASE_URL here on purpose. The integration suite exercises
      # the app's DB-unreachable graceful-degradation paths (503 / demo-cred
      # fallback), which require Prisma to have no reachable DB. Pointing these
      # tests at the Postgres service above would flip those assertions.
      - name: Test
        run: npm test

  frontend:
    name: Frontend — typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck + build
        run: npm run build

  angular:
    name: Angular — test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22's CLI requires Node >= 24.15 (the other jobs pin 20);
          # setup-node resolves "24" to the latest 24.x, which satisfies it.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - run: npm ci

      # Vitest-based unit-test builder (Angular 22 default). --watch=false so the
      # runner exits instead of watching. `npm run build` runs `ng build`, which
      # includes the strict-template typecheck.
      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  data-platform:
    name: Data platform — pipeline + dbt tests + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 to match requirements.txt: dbt-core has no wheels for the
          # newest Python, so the whole toolchain is pinned to it.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            data-platform/requirements.txt
            data-platform/api/requirements.txt
            data-platform/requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r api/requirements.txt -r requirements-dev.txt

      # The warehouse itself is gitignored (regenerated, never committed), but
      # data/raw/ais_sample.csv is tracked precisely so the pipeline can be
      # rebuilt from scratch here. This step proves that still works.
      - name: Load bronze (raw CSV -> DuckDB)
        run: python ingestion/load_bronze.py

      # `dbt build` = run + test interleaved, so a model's tests run right after
      # it builds and a failure stops its dependents. This covers the silver/gold
      # transforms plus the schema tests and the singular assert_* tests.
      - name: dbt build (silver + gold, with data tests)
        working-directory: data-platform/dbt
        run: dbt build --profiles-dir .

      - name: API auth tests
        # Set explicitly so the suite tests a known secret rather than depending
        # on main.py's dev-only fallback, which exists for local convenience.
        env:
          JWT_SECRET: ci-test-secret
        run: pytest api/test_auth.py

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. The point is that a broken Dockerfile
      # fails the PR instead of surfacing at deploy time. Both the dev and prod
      # images are built because they diverge (prod is multi-stage, non-root).
      # Layer cache is scoped per image so the four builds don't evict each other.
      - name: Backend (dev)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Backend (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Frontend (dev)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev

      - name: Frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          # VITE_API_URL is baked into the bundle at build time; the default
          # (/api, same-origin behind the nginx proxy) is what prod deploys use.
          # VITE_ANALYTICS_API_URL defaults to / for the same reason.
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      # Also exercises the pipeline: this image's build stage runs
      # load_bronze + `dbt build` to bake the warehouse in, so a broken
      # transform or a failing data test fails the image build here.
      - name: Analytics API (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./data-platform
          file: ./data-platform/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=analytics-prod
          cache-to: type=gha,mode=max,scope=analytics-prod

  # ---------------------------------------------------------------------------
  # Build, scan and publish the API image.
  #
  # WHY THIS EXISTS: before this job, images reached the cluster via
  # `k3d image import` — copying a tarball in by hand. That has no equivalent
  # outside a laptop. Real clusters pull from a registry, so CI has to produce
  # one.
  #
  # ON PULL REQUESTS the image is built and scanned but NOT pushed: a PR must
  # not be able to publish an artifact, and its diff has not been reviewed yet.
  # Pushing happens only on merge to main.
  # ---------------------------------------------------------------------------
  publish-api-image:
    name: API image — build, scan, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, load into the local daemon so the scanner can read it. The
      # push (if any) reuses this same build via the layer cache, so the image
      # that gets scanned is byte-for-byte the image that gets published — not a
      # rebuild that might differ.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          tags: vesselmind-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the build on serious, fixable vulnerabilities. `ignore-unfixed` is
      # deliberate: a CRITICAL with no available patch is not something this
      # pipeline can act on, and failing on it would train everyone to ignore
      # the scanner. Findings without fixes still show in the job log.
      # Pinned to a commit SHA, not a tag. A third-party action runs arbitrary
      # code with access to this job's token; a mutable tag can be repointed at
      # new code after review. The SHA cannot. (v0.36.0 at time of pinning.)
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: vesselmind-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA, never :latest.
      #
      # An immutable tag means a running pod's image tells you exactly which
      # commit produced it, and a rollback is "deploy the previous SHA" rather
      # than "hope the registry still has what :latest used to point at".
      # :latest is a moving target: two pods on the same tag can run different
      # code, and there is no way to tell from the manifest which is which.
      #
      # The `main` tag is published alongside purely as a human convenience for
      # "what is current" — nothing should ever deploy from it.
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vesselai-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vesselai-api:main
          cache-from: type=gha
