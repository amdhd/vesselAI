# One-off restore from the newest backup in the postgres-backups PVC.
#
# NOT in k8s/base/ on purpose: `kubectl apply -f k8s/base/` must never restore a
# database as a side effect of a routine deploy. This is a break-glass object,
# applied deliberately.
#
# THE COST OF THAT DECISION, PAID IN PHASE 7: because this file is not in the
# kustomization, nothing renders it — no CI, no Argo sync, no admission ever saw
# it. When Phase 7 enforced Pod Security Standards at `restricted` on this
# namespace, this Job (which had no securityContext at all) started being
# rejected at admission, and nothing noticed because nothing exercised it. The
# break-glass path was broken by the very hardening it lives outside of.
#
# Kept out of the kustomization still — a restore must remain a deliberate act —
# but the price of that is that its compliance is verified only when someone
# remembers to check. Before depending on this in an incident, prove it:
#
#   kubectl apply --dry-run=server -f k8s/jobs/postgres-restore.yaml
#
# The securityContext below mirrors the backup CronJob (12-postgres-backup.yaml),
# which is the same image doing the same work in reverse.
#
# backoffLimit: 0 — a failed restore must not retry automatically. Re-running a
# partial restore over a partially restored database makes diagnosis harder, and
# the operator needs to look before trying again.
#
# Procedure and caveats: docs/BACKUP_RESTORE.md
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
  namespace: vesselmind
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        # Not cosmetic: the NetworkPolicy guarding Postgres
        # (17-networkpolicies.yaml) admits ingress only from pods labelled
        # tier: batch. Without this, the restore pod is accepted by admission
        # and then its psql connection is silently dropped — a connect timeout
        # that looks like a database problem during an incident.
        tier: batch
    spec:
      serviceAccountName: batch
      automountServiceAccountToken: false
      # PSS `restricted` — the same set as the backup job. uid 70 is the
      # postgres user in the alpine image, numeric because the kubelet cannot
      # verify a named user against runAsNonRoot. The backups are written by
      # uid 70, so the same uid can read them. No fsGroup, deliberately: it
      # would chgrp the shared backup volume on mount, and a break-glass tool
      # whose only job is reading should not be mutating volume metadata.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: restore
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              # WAIT FOR POSTGRES. A restore is run during an incident, often
              # right after the database has been restarted — so "is it accepting
              # connections yet" is a real question, not a formality.
              i=0
              until pg_isready -h "$PGHOST" -U "$PGUSER" -q; do
                i=$((i+1))
                [ "$i" -gt 60 ] && { echo "postgres not ready after 120s"; exit 1; }
                sleep 2
              done

              # RESTORE_FILE lets an operator name a specific archive. Without it,
              # the newest is used — but only if it passes validation. It is NOT
              # silently skipped in favour of an older one: quietly restoring
              # yesterday's data instead of today's is data loss that looks like
              # success. Fail loudly, list the candidates, let a human choose.
              TARGET="${RESTORE_FILE:-$(ls -1t /backups/vesselmind-*.sql.gz 2>/dev/null | head -1)}"
              [ -n "$TARGET" ] || { echo "no backups found in /backups"; exit 1; }
              echo "candidate: $TARGET"

              # VALIDATE BEFORE TOUCHING THE DATABASE — and gzip -t is not enough.
              # A failed pg_dump leaves a VALID, EMPTY 20-byte gzip stream that
              # gzip -t passes; restoring it succeeds and empties the database,
              # which is worse than failing because it looks like recovery worked.
              # (The backup job now refuses to publish such a file, but archives
              # written before that change may still be on this volume, and this
              # is the last line of defence.)
              gzip -t "$TARGET" || { echo "REFUSING: $TARGET is not a valid gzip archive"; exit 1; }

              SIZE=$(wc -c < "$TARGET")
              if [ "$SIZE" -lt 512 ]; then
                echo "REFUSING: $TARGET is only ${SIZE} bytes — an empty or failed dump."
                echo "Valid candidates, newest first:"
                for f in $(ls -1t /backups/vesselmind-*.sql.gz 2>/dev/null); do
                  sz=$(wc -c < "$f")
                  [ "$sz" -ge 512 ] && echo "  $f (${sz} bytes)"
                done
                echo "Re-run with RESTORE_FILE=<path> to choose one explicitly."
                exit 1
              fi

              # `|| true` and a case statement, not `| head | grep -q`: under
              # pipefail, head closing the pipe makes gunzip exit 141 and the
              # pipeline report failure even on a match.
              HEADER=$(gunzip -c "$TARGET" 2>/dev/null | head -20 || true)
              case "$HEADER" in
                *"PostgreSQL database dump"*) ;;
                *) echo "REFUSING: $TARGET has no pg_dump header — not a database dump"; exit 1 ;;
              esac

              echo "validated ($SIZE bytes, header ok) — restoring"
              # ON_ERROR_STOP=1 matters: without it psql continues past failed
              # statements and exits 0, producing a "successful" restore of a
              # partially populated database.
              gunzip -c "$TARGET" | psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" >/dev/null
              echo "restore completed from $TARGET"
          env:
            # Optional override: kubectl set env job/postgres-restore RESTORE_FILE=/backups/...
            # Empty means "newest, if it validates".
            - name: RESTORE_FILE
              value: ''
            - name: PGHOST
              value: postgres-0.postgres.vesselmind.svc.cluster.local
            - name: PGUSER
              valueFrom: { configMapKeyRef: { name: vesselmind-config, key: POSTGRES_USER } }
            - name: PGDATABASE
              valueFrom: { configMapKeyRef: { name: vesselmind-config, key: POSTGRES_DB } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: vesselmind-secrets, key: POSTGRES_PASSWORD } }
          # PSS `restricted`.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: backups
              mountPath: /backups
          # Mirror the backup job's footprint. The namespace LimitRange would
          # default these in, but explicit is better for a break-glass pod you
          # cannot afford to lose to a quota surprise.
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: postgres-backups
