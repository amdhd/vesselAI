# Tell Argo which resource types to watch — the mirror image of the narrowed
# ClusterRole in 03-controller-rbac.yaml.
#
# WHY IT IS REQUIRED, not optional. By default the application-controller builds
# an informer over EVERY resource type the API server exposes, so it can assess
# health and detect orphans. With RBAC narrowed, each type it can no longer list
# produces a `forbidden` error, repeatedly, forever — which both wastes cycles
# and buries genuine errors in noise. Narrowing RBAC without this is how people
# conclude that least-privilege Argo "does not work".
#
# The two lists must stay in step: a kind added here but not to the ClusterRole
# produces forbidden errors; added there but not here is simply never watched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.inclusions: |
    - apiGroups: [""]
      kinds:
        - Namespace
        - ConfigMap
        - Secret
        - Service
        - ServiceAccount
        - PersistentVolumeClaim
        - ResourceQuota
        - LimitRange
        - Pod
      clusters: ["*"]
    - apiGroups: ["apps"]
      kinds: ["Deployment", "StatefulSet", "ReplicaSet"]
      clusters: ["*"]
    - apiGroups: ["batch"]
      kinds: ["Job", "CronJob"]
      clusters: ["*"]
    - apiGroups: ["networking.k8s.io"]
      kinds: ["Ingress", "NetworkPolicy"]
      clusters: ["*"]
    - apiGroups: ["autoscaling"]
      kinds: ["HorizontalPodAutoscaler"]
      clusters: ["*"]
    - apiGroups: ["policy"]
      kinds: ["PodDisruptionBudget"]
      clusters: ["*"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      kinds: ["Role", "RoleBinding", "ClusterRole", "ClusterRoleBinding"]
      clusters: ["*"]
    - apiGroups: ["bitnami.com"]
      kinds: ["SealedSecret"]
      clusters: ["*"]

    # StorageClass, cluster-scoped, and needed only on EKS.
    #
    # k8s/overlays/prod ships a gp3 StorageClass because EKS's default gp2 uses
    # the in-tree provisioner and cannot expand volumes. Without this entry Argo
    # refuses to manage it:
    #
    #   ExcludedResourceWarning: Resource storage.k8s.io/StorageClass gp3 is
    #   excluded in the settings
    #
    # The Application then reports Healthy while every PVC stays Pending,
    # because the class they name does not exist. Healthy-but-not-working is the
    # worst shape a status can take, and it is what an allow-list produces when
    # it falls behind the manifests it is meant to bound.
    #
    # The dev overlay has no StorageClass, so this widens what Argo may touch on
    # k3d for no benefit there — the honest cost of one shared inclusion list
    # across two clusters.
    - apiGroups: ["storage.k8s.io"]
      kinds: ["StorageClass"]
      clusters: ["*"]
