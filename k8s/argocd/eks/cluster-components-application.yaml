# The vendored cluster controllers, under GitOps like everything else.
#
# BOOTSTRAP ORDER MATTERS AND THIS APPLICATION CANNOT FIX IT. The load balancer
# controller in here is what turns Ingress objects into an ALB — including the
# Ingress that Argo CD's own UI is served on. So the controller must be running
# before Argo CD is reachable by hostname, which means it is applied by hand
# during bootstrap (see docs/EKS.md) and only afterwards adopted by this
# Application.
#
# That is not a workaround; it is the ordinary chicken-and-egg of GitOps
# bootstrap. Argo CD adopts existing resources cleanly, so applying by hand
# first and letting Argo take ownership second produces the same end state with
# no drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vesselmind-cluster-components
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vesselmind
  sources:
    - repoURL: https://github.com/amdhd/vesselAI.git
      targetRevision: main
      path: k8s/aws/load-balancer-controller
    - repoURL: https://github.com/amdhd/vesselAI.git
      targetRevision: main
      path: k8s/aws/cluster-autoscaler
    - repoURL: https://github.com/amdhd/vesselAI.git
      targetRevision: main
      path: k8s/aws/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # PRUNE IS OFF, deliberately, and this is the one place in the project
      # where that is the right call. These manifests include CRDs. A prune
      # triggered by a bad render would delete the TargetGroupBinding CRD and
      # every ALB mapping with it, taking the cluster's ingress down to fix a
      # YAML mistake. Removing a controller should be a deliberate act.
      prune: false
      selfHeal: false
