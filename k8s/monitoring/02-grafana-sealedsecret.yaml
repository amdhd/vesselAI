# Grafana admin password, sealed — SAFE TO COMMIT TO A PUBLIC REPO.
#
# WHY THIS EXISTS: the Grafana image's default admin password is admin/admin,
# and our Grafana exposed that default — anonymous read access masked it, but
# anyone who could reach /grafana could also log in as admin. This SealedSecret
# carries a generated password; the Deployment reads it via
# GF_SECURITY_ADMIN_PASSWORD and Grafana applies it to the admin user at
# startup.
#
# The mechanics (key, scope, what sealing does and does not protect) are
# explained in k8s/base/02-sealedsecret.yaml — same controller, same rules.
# Scope here is strict: this decrypts ONLY as a Secret named grafana-secrets
# in namespace `monitoring`.
#
# THE OPERATIONAL TRAP, shared with every sealed value in this repo: the
# sealing key lives inside the cluster. `k3d cluster delete` destroys it, and
# this file becomes permanently undecryptable. Back the key up before deleting
# the cluster, or expect to re-seal.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: grafana-secrets
      namespace: monitoring
