# Grafana, fully provisioned from ConfigMaps.
#
# WHY PROVISIONING RATHER THAN CLICKING: a dashboard built in the UI lives in
# Grafana's own database and dies with the pod (emptyDir here). Provisioned from
# files, the datasource and dashboard are declarative, reviewable in git, and
# recreated identically on any cluster. Same argument as the rest of this repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # In-cluster DNS: <service>.<namespace>.svc. Grafana queries Prometheus
        # server-side, so the browser never talks to Prometheus directly and it
        # needs no Ingress of its own.
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: vesselmind
        orgId: 1
        folder: VesselMind
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-api
  namespace: monitoring
data:
  api.json: |
    {
      "uid": "vesselmind-api",
      "title": "VesselMind API",
      "tags": ["vesselmind"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (req/s)",
          "description": "Derived from the histogram's _count series. rate() over 1m, summed across all replicas.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count[1m]))",
              "legendFormat": "total",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latency p95 / p50 (seconds)",
          "description": "histogram_quantile over the _bucket series. Accuracy is bounded by the app's bucket boundaries — with a highest finite bucket of 10s, anything slower is indistinguishable.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 0 } }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "API replicas (from scrape targets)",
          "description": "count(up) over the pod-discovery job. No kube-state-metrics needed: Prometheus scrapes every pod individually, so counting healthy targets IS the ready replica count. Put on the same time axis as load so scaling is visible as a response to traffic.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 20, "lineInterpolation": "stepAfter" } }, "overrides": [] },
          "targets": [
            {
              "expr": "count(up{job=\"vesselmind-api\"} == 1)",
              "legendFormat": "ready replicas",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request rate by status code",
          "description": "Splits the same histogram by status label. A rising 429 series would show the rate limiter biting; 5xx would show the app failing.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_request_duration_seconds_count[1m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472      # the grafana image's own uid
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            # Served under /grafana by the Ingress, so Grafana must know its own
            # public URL — otherwise its redirects and asset links point at /
            # and the UI half-loads with broken CSS.
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:8080/grafana
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: 'true'
            # The image's default admin password is admin/admin. This overrides
            # it: Grafana applies admin_password from config to the admin user
            # at every startup, so the pod just needs the env var. The value
            # comes from a SealedSecret (02-grafana-sealedsecret.yaml) — the
            # plaintext lives only in the cluster, where RBAC can gate it.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password
            # ANONYMOUS ACCESS IS OFF.
            #
            # It was on, described as a local-only convenience because the
            # Ingress only listened on localhost. That reasoning stops holding
            # the moment this runs on EKS, where the same Ingress becomes a
            # public load balancer with a real DNS name — and metrics disclose
            # route names, traffic shape and error rates, which is a map of the
            # application for anyone who asks.
            #
            # A setting whose safety depends on where it happens to be deployed
            # is a setting that will eventually be deployed somewhere else. The
            # admin password already comes from a SealedSecret, so requiring a
            # login costs nothing.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-api
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# A SEPARATE Ingress, in the monitoring namespace.
#
# Ingress is namespaced and can only route to Services in ITS OWN namespace, so
# the vesselmind Ingress cannot reach Grafana. Two Ingress objects, one Traefik
# controller, one host — Traefik merges the rules by path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: traefik
  # TLS.
  #
  # LOCALLY there is no domain and no CA, so no `secretName` is given: Traefik
  # serves its built-in self-signed certificate. That is not trust — a browser
  # will warn — but it is real encryption, and more importantly it exercises the
  # wiring, so TLS is not something first attempted on the day it matters.
  #
  # ON EKS this changes shape rather than being added. With the AWS Load Balancer
  # Controller the ALB terminates TLS using an ACM certificate, declared through
  # annotations on this object:
  #     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
  #     alb.ingress.kubernetes.io/ssl-redirect: '443'
  # With an nginx or Traefik ingress instead, cert-manager issues a real
  # certificate from Let's Encrypt into `secretName` below. Either way the
  # decision is which issuer, not whether.
  #
  # WHY IT MATTERS MORE THAN IT LOOKS HERE: this Ingress currently answers on
  # localhost. On EKS the same object becomes a public load balancer with a DNS
  # name, and everything crossing it — login credentials, JWTs, the Argo CD
  # session cookie — is in cleartext until this is real.
  tls:
    - {}
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
