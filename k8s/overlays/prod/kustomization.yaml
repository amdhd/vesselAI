# Prod overlay.
#
# NOT DEPLOYED ANYWHERE YET — it exists so the difference between environments is
# explicit and reviewable rather than living in someone's head, and so Phase 9's
# EKS cluster has a target. Stated plainly rather than implying a production
# deployment exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vesselmind

resources:
  - ../../base
  # AWS-only. The base has no StorageClass at all, because k3d supplies one.
  - storageclass-gp3.yaml

patches:
  # SEALED SECRETS, re-sealed against the EKS cluster's key.
  #
  # k8s/base/02-sealedsecret.yaml is encrypted to the k3d controller's keypair
  # and cannot be decrypted here — a fresh cluster generates a new key. The
  # failure is silent: the SealedSecret applies cleanly, `kubectl get
  # sealedsecret` looks healthy, only the controller log mentions decryption,
  # and pods sit in CreateContainerConfigError waiting on a Secret that never
  # appears.
  #
  # Generated by k8s/scripts/reseal-for-eks.sh, which must be re-run against
  # every new cluster. Committing the ciphertext is the point of Sealed
  # Secrets — this file is safe in a public repo, and useless to anyone without
  # this cluster's private key.
  - path: sealedsecret-patch.yaml
    target:
      kind: SealedSecret
      name: vesselmind-secrets

  - target:
      kind: ConfigMap
      name: vesselmind-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      # The real limit. 200 per 15 minutes per IP, which only counts correctly
      # because TRUST_PROXY is set — otherwise every user shares one bucket.
      # Still per-pod: express-rate-limit uses an in-process store, so the
      # effective ceiling is replicas x max until a shared Redis store exists.
      - op: replace
        path: /data/API_RATE_LIMIT_MAX
        value: '200'
      - op: replace
        path: /data/API_RATE_LIMIT_WINDOW_MS
        value: '900000'

  - target:
      kind: Deployment
      name: api
    patch: |-
      # NOTE: no replicas here. The HPA owns /spec/replicas — declaring it in
      # git makes Argo CD selfHeal fight the autoscaler (see 05-api-deployment.yaml).
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m

  # minReplicas 3 is also the resting pod count — the HPA owns /spec/replicas
  # (see 05-api-deployment.yaml).
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  # Two web replicas is a laptop compromise; a real deployment spreads further.
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4

  # ResourceQuota sized for THIS overlay's peak, not the laptop's.
  #
  # The base quota is dev-shaped: 3 CPU of requests, which the api HPA alone
  # blows through at 12 of its 20 replicas. A quota below peak demand does not
  # fail at apply time — it fails later and silently: the HPA reports desired: 20
  # while the ReplicaSet emits FailedCreate "exceeded quota" and pods never
  # appear, so the autoscaler looks like it is working. That is a much worse
  # failure than a rejected manifest.
  #
  # Numbers come from k8s/scripts/check-quota-headroom.py, which renders the
  # overlay and sums every workload at its maximum replica count (HPA maxReplicas
  # where one exists). Measured peak for prod: 5.30 CPU / 5.62Gi requests,
  # 12.80 CPU / 12.38Gi limits. Set with roughly a third headroom on top, because
  # Jobs and CronJobs draw from the same quota and must not be starved by a
  # fully-scaled API — a migration that cannot schedule blocks a deploy.
  #
  # limits are quota-enforced too, and are deliberately far above requests: that
  # gap IS the burst capacity. Sizing limits equal to requests would remove the
  # headroom that makes limits worth setting.
  - target:
      kind: ResourceQuota
      name: vesselmind
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: '8'
      - op: replace
        path: /spec/hard/requests.memory
        value: 10Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: '20'
      - op: replace
        path: /spec/hard/limits.memory
        value: 20Gi
      # 20 api + 4 web + postgres + analytics + worker + batch, with room for a
      # rollout running old and new pods at once.
      - op: replace
        path: /spec/hard/pods
        value: '60'

  # STORAGE CLASS, named explicitly on both claims.
  #
  # The base omits storageClassName so k3d falls through to local-path. On EKS
  # that fall-through lands on the gp2 class EKS ships — in-tree provisioner,
  # no volume expansion — so both claims have to say what they want. See
  # storageclass-gp3.yaml for why gp3 is not simply made the default instead.
  #
  # `add` rather than `replace`: the field does not exist in the base, and
  # replace on a missing path fails the render rather than creating it.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3

  # The pg_dump backup volume. Easy to forget precisely because it is not the
  # database — but a backup on unexpandable legacy storage is a backup that
  # fails at the least convenient moment.
  - target:
      kind: PersistentVolumeClaim
      name: postgres-backups
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp3

  # The DuckDB warehouse volume (k8s/base/13-analytics.yaml). Third of three,
  # and the one that was missed on the first pass — found by rendering the
  # overlay and listing every claim rather than by reading the files, which is
  # the only reliable way to catch a PVC that lives inside a service manifest
  # rather than in an obviously storage-shaped file.
  - target:
      kind: PersistentVolumeClaim
      name: warehouse
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp3

  # ---------------------------------------------------------------------------
  # INGRESS: Traefik -> AWS Application Load Balancer.
  #
  # The base targets k3s's bundled Traefik. On EKS there is no Traefik, and an
  # Ingress whose class nothing claims silently does nothing — the exact failure
  # 10-ingress.yaml warns about. The path fan-out and the backends are unchanged;
  # only the controller and how TLS terminates differ.
  # ---------------------------------------------------------------------------
  - target:
      kind: Ingress
      name: vesselmind
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: alb

      # A HOST, which the base deliberately does not have. Two things need it:
      # external-dns reads it to decide which Route 53 record to create, and the
      # load balancer controller uses it to find a matching ACM certificate.
      # Without a host this Ingress answers on the ALB's own DNS name and
      # neither of those can happen.
      - op: add
        path: /spec/rules/0/host
        value: vesselmind.ahmadhadi.org

      # TLS: drop the base's empty `tls: [{}]`. That entry exists so Traefik
      # serves its self-signed certificate locally. On an ALB, TLS is configured
      # by the annotations below and a tls block with no secretName just
      # confuses the reader about where the certificate comes from.
      - op: remove
        path: /spec/tls

      - op: add
        path: /metadata/annotations
        value:
          # Public ALB. The alternative, `internal`, is only reachable inside
          # the VPC — correct for an internal API, wrong for the app's front door.
          alb.ingress.kubernetes.io/scheme: internet-facing

          # target-type: ip sends traffic straight to POD IPs. The alternative,
          # `instance`, routes via a NodePort on every node and then kube-proxy
          # hops again to wherever the pod actually is — an extra hop, and it
          # makes the ALB health check test the node rather than the pod. ip is
          # possible here because the VPC CNI gives every pod a real VPC address.
          alb.ingress.kubernetes.io/target-type: ip

          # ONE ALB FOR THE WHOLE CLUSTER. Without a group, every Ingress object
          # gets its own load balancer: app + Argo CD + Grafana would be three
          # ALBs at ~$16/month each. A shared group merges them into one, with
          # rules routed by host. This is the single largest avoidable cost in
          # the ingress layer.
          alb.ingress.kubernetes.io/group.name: vesselmind

          # Listen on both, and send 80 to 443. The redirect matters more than it
          # looks: without it the ALB answers plain HTTP happily, and every
          # credential and JWT that PR #74 moved onto TLS travels in clear text
          # for anyone who types the bare hostname.
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
          alb.ingress.kubernetes.io/ssl-redirect: '443'

          # NO certificate-arn ON PURPOSE. The controller discovers a matching
          # ACM certificate from the host above. Pinning the ARN would work and
          # is what most examples show — but the ARN contains a UUID that is new
          # on every terraform apply, so a hardcoded one is wrong the moment the
          # cluster is rebuilt, and wrong in a way that fails at ALB creation
          # rather than at render. Discovery is stable across rebuilds.

          # Health checks are ALB-wide for this Ingress and cannot differ per
          # backend from here. `/` is the only path all four backends answer;
          # the API's real readiness endpoint is /api/ready (PR #74), which is
          # what the kubelet probe uses. VERIFY IN-CLUSTER whether per-service
          # health-check overrides via Service annotations are honoured by
          # v3.5.0 before assuming the API target group is checking the right
          # thing — the kubelet probe already gates Service membership, so this
          # is defence in depth rather than the primary signal.
          alb.ingress.kubernetes.io/healthcheck-path: /

# ---------------------------------------------------------------------------
# IMAGES — this is what makes the overlay deployable to EKS at all.
#
# The base carries logical names (vesselmind/api). Dev maps them onto the local
# k3d registry; prod maps them onto GHCR, which any cluster can reach. A cluster
# in AWS cannot resolve `k3d-vesselmind-registry:5111`, so hardcoding it in the
# base — as this project did until now — meant the manifests only ever ran on the
# laptop that built them.
#
# PINNED BY DIGEST, not tag. A tag is a pointer someone can move; a digest IS the
# content. Two nodes pulling the same tag can get different bytes, which is
# exactly the class of "works on one node" problem you cannot debug. Digests were
# resolved from the registry at the commit named below, not copied from a build
# log:
#
#   crane digest ghcr.io/amdhd/vesselai-api:<sha>
#   # or, with no tooling installed:
#   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:amdhd/vesselai-api:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://ghcr.io/v2/amdhd/vesselai-api/manifests/<sha> | grep -i docker-content-digest
#
# NO imagePullSecrets NEEDED. Verified by pulling anonymously, which is what an
# EKS node does: all three packages return HTTP 200 without credentials. If a
# package is ever made private, add a pull secret to the ServiceAccounts rather
# than to each pod — a secret on the SA applies to every pod that uses it. On EKS
# the more idiomatic path is ECR, where the node's IAM role grants the pull and
# there is no secret to rotate at all.
#
# All five digests are from commit a2853e3 — one build, one commit, so the whole
# stack deploys as a consistent set rather than a mix of whatever each image
# happened to be pinned to last.
images:
  - name: vesselmind/api
    newName: ghcr.io/amdhd/vesselai-api
    digest: sha256:72a8fd856dad2c465e807f0c58181c33a9de61119d292f2b497adecd996212c4
  - name: vesselmind/web
    newName: ghcr.io/amdhd/vesselai-web
    digest: sha256:b689a3f9846445cde812ddd5cd7b724296334cc346f6edcb657f81ecd4ebe00a
  - name: vesselmind/analytics
    newName: ghcr.io/amdhd/vesselai-analytics
    digest: sha256:ec8d7275dc3ac0c4b63eb3698f39ccfe3bb70a726729eddea40d4ea43ea58ce8
  - name: vesselmind/migrate
    newName: ghcr.io/amdhd/vesselai-migrate
    digest: sha256:fc2c8e43e200bf16b95c31075661d590123d6d686866d5d2893bc436af6c600f
  - name: vesselmind/warehouse-builder
    newName: ghcr.io/amdhd/vesselai-warehouse-builder
    digest: sha256:d3dff307cc603dd76d194481fd5b891c1b75ff6ff9c6df1eb48fee49b58a30b8

  # Postgres is pinned by digest too — the policy is "production pins by digest",
  # and an exception for the database would be the wrong one to make. This is the
  # multi-arch INDEX digest, so it resolves on arm64 and on EKS's amd64 alike;
  # pinning a per-architecture digest would work on one and fail on the other.
  #
  # This fixes mutability, NOT the rate limit noted below — those are separate
  # problems and a digest only solves the first.
  - name: postgres
    digest: sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685

# KEEPING THESE CURRENT is manual today, and that is the honest remaining gap.
# CI publishes ghcr.io/amdhd/vesselai-*:<commit-sha> on every merge, but nothing
# writes the resulting digest back here — so a deploy means resolving digests and
# editing this file. The two ways to close it:
#   - Argo CD Image Updater, which watches the registry and commits the new
#     reference itself; or
#   - a CI step that resolves the digest after publishing and commits it, which
#     is more auditable because the change arrives as a reviewable diff.
# Until one exists, treat this block as the promotion record: changing it IS the
# deploy.

# postgres:16-alpine comes from Docker Hub unchanged. On EKS that is a real
# consideration: Docker Hub rate-limits anonymous pulls per source IP, and every
# node behind one NAT gateway shares that quota. A node group scaling up during
# an incident is exactly when you would hit it. Mirror it into ECR, or use ECR
# Public / a pull-through cache, before relying on this in anger.
