# Prod overlay.
#
# NOT DEPLOYED ANYWHERE YET — it exists so the difference between environments is
# explicit and reviewable rather than living in someone's head, and so Phase 9's
# EKS cluster has a target. Stated plainly rather than implying a production
# deployment exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vesselmind

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: vesselmind-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      # The real limit. 200 per 15 minutes per IP, which only counts correctly
      # because TRUST_PROXY is set — otherwise every user shares one bucket.
      # Still per-pod: express-rate-limit uses an in-process store, so the
      # effective ceiling is replicas x max until a shared Redis store exists.
      - op: replace
        path: /data/API_RATE_LIMIT_MAX
        value: '200'
      - op: replace
        path: /data/API_RATE_LIMIT_WINDOW_MS
        value: '900000'

  - target:
      kind: Deployment
      name: api
    patch: |-
      # NOTE: no replicas here. The HPA owns /spec/replicas — declaring it in
      # git makes Argo CD selfHeal fight the autoscaler (see 05-api-deployment.yaml).
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m

  # minReplicas 3 is also the resting pod count — the HPA owns /spec/replicas
  # (see 05-api-deployment.yaml).
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  # Two web replicas is a laptop compromise; a real deployment spreads further.
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4

  # ResourceQuota sized for THIS overlay's peak, not the laptop's.
  #
  # The base quota is dev-shaped: 3 CPU of requests, which the api HPA alone
  # blows through at 12 of its 20 replicas. A quota below peak demand does not
  # fail at apply time — it fails later and silently: the HPA reports desired: 20
  # while the ReplicaSet emits FailedCreate "exceeded quota" and pods never
  # appear, so the autoscaler looks like it is working. That is a much worse
  # failure than a rejected manifest.
  #
  # Numbers come from k8s/scripts/check-quota-headroom.py, which renders the
  # overlay and sums every workload at its maximum replica count (HPA maxReplicas
  # where one exists). Measured peak for prod: 5.30 CPU / 5.62Gi requests,
  # 12.80 CPU / 12.38Gi limits. Set with roughly a third headroom on top, because
  # Jobs and CronJobs draw from the same quota and must not be starved by a
  # fully-scaled API — a migration that cannot schedule blocks a deploy.
  #
  # limits are quota-enforced too, and are deliberately far above requests: that
  # gap IS the burst capacity. Sizing limits equal to requests would remove the
  # headroom that makes limits worth setting.
  - target:
      kind: ResourceQuota
      name: vesselmind
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: '8'
      - op: replace
        path: /spec/hard/requests.memory
        value: 10Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: '20'
      - op: replace
        path: /spec/hard/limits.memory
        value: 20Gi
      # 20 api + 4 web + postgres + analytics + worker + batch, with room for a
      # rollout running old and new pods at once.
      - op: replace
        path: /spec/hard/pods
        value: '60'

# ---------------------------------------------------------------------------
# IMAGES — this is what makes the overlay deployable to EKS at all.
#
# The base carries logical names (vesselmind/api). Dev maps them onto the local
# k3d registry; prod maps them onto GHCR, which any cluster can reach. A cluster
# in AWS cannot resolve `k3d-vesselmind-registry:5111`, so hardcoding it in the
# base — as this project did until now — meant the manifests only ever ran on the
# laptop that built them.
#
# PINNED BY DIGEST, not tag. A tag is a pointer someone can move; a digest IS the
# content. Two nodes pulling the same tag can get different bytes, which is
# exactly the class of "works on one node" problem you cannot debug. Digests were
# resolved from the registry at the commit named below, not copied from a build
# log:
#
#   crane digest ghcr.io/amdhd/vesselai-api:<sha>
#   # or, with no tooling installed:
#   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:amdhd/vesselai-api:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://ghcr.io/v2/amdhd/vesselai-api/manifests/<sha> | grep -i docker-content-digest
#
# NO imagePullSecrets NEEDED. Verified by pulling anonymously, which is what an
# EKS node does: all three packages return HTTP 200 without credentials. If a
# package is ever made private, add a pull secret to the ServiceAccounts rather
# than to each pod — a secret on the SA applies to every pod that uses it. On EKS
# the more idiomatic path is ECR, where the node's IAM role grants the pull and
# there is no secret to rotate at all.
#
# Digests below are from commit 3ade74a (main at the time of writing).
images:
  - name: vesselmind/api
    newName: ghcr.io/amdhd/vesselai-api
    digest: sha256:3bec2f71691b7b807be94028c0dd08a9ac9444ec284a51eae0b639f9f6e783b9
  - name: vesselmind/web
    newName: ghcr.io/amdhd/vesselai-web
    digest: sha256:ad793e6d74cd63e7d738ee23d502c7d5129a38a0e8a56c0eb5a5fae8890c847b
  - name: vesselmind/analytics
    newName: ghcr.io/amdhd/vesselai-analytics
    digest: sha256:1d14c6e44508b32da94b83695bf31ba9b1d73d2cd142d86d1ca7187a011499f0

  # THESE TWO ARE PINNED BY TAG, NOT DIGEST, AND THAT IS A KNOWN COMPROMISE.
  #
  # CI did not publish the build-stage images until this change, so no digest
  # exists to pin yet — the first run on main creates them. `main` is a MUTABLE
  # tag and everything above argues against exactly that.
  #
  # REQUIRED BEFORE PROD IS DEPLOYED: resolve these two digests with the command
  # above and replace `newTag` with `digest`. Until then this overlay is not
  # production-ready, and saying so here is better than a footnote nobody reads.
  #
  # These are batch images (migrations, warehouse rebuild), not serving images,
  # so a mutable tag is less dangerous here than it would be on the API — but
  # "less dangerous" is not "correct".
  - name: vesselmind/migrate
    newName: ghcr.io/amdhd/vesselai-migrate
    newTag: main
  - name: vesselmind/warehouse-builder
    newName: ghcr.io/amdhd/vesselai-warehouse-builder
    newTag: main

# postgres:16-alpine comes from Docker Hub unchanged. On EKS that is a real
# consideration: Docker Hub rate-limits anonymous pulls per source IP, and every
# node behind one NAT gateway shares that quota. A node group scaling up during
# an incident is exactly when you would hit it. Mirror it into ECR, or use ECR
# Public / a pull-through cache, before relying on this in anger.
