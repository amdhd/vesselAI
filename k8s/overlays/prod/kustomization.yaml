# Prod overlay.
#
# NOT DEPLOYED ANYWHERE YET — it exists so the difference between environments is
# explicit and reviewable rather than living in someone's head, and so Phase 9's
# EKS cluster has a target. Stated plainly rather than implying a production
# deployment exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vesselmind

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: vesselmind-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      # The real limit. 200 per 15 minutes per IP, which only counts correctly
      # because TRUST_PROXY is set — otherwise every user shares one bucket.
      # Still per-pod: express-rate-limit uses an in-process store, so the
      # effective ceiling is replicas x max until a shared Redis store exists.
      - op: replace
        path: /data/API_RATE_LIMIT_MAX
        value: '200'
      - op: replace
        path: /data/API_RATE_LIMIT_WINDOW_MS
        value: '900000'

  - target:
      kind: Deployment
      name: api
    patch: |-
      # NOTE: no replicas here. The HPA owns /spec/replicas — declaring it in
      # git makes Argo CD selfHeal fight the autoscaler (see 05-api-deployment.yaml).
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m

  # minReplicas 3 is also the resting pod count — the HPA owns /spec/replicas
  # (see 05-api-deployment.yaml).
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  # Two web replicas is a laptop compromise; a real deployment spreads further.
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4

  # ResourceQuota sized for THIS overlay's peak, not the laptop's.
  #
  # The base quota is dev-shaped: 3 CPU of requests, which the api HPA alone
  # blows through at 12 of its 20 replicas. A quota below peak demand does not
  # fail at apply time — it fails later and silently: the HPA reports desired: 20
  # while the ReplicaSet emits FailedCreate "exceeded quota" and pods never
  # appear, so the autoscaler looks like it is working. That is a much worse
  # failure than a rejected manifest.
  #
  # Numbers come from k8s/scripts/check-quota-headroom.py, which renders the
  # overlay and sums every workload at its maximum replica count (HPA maxReplicas
  # where one exists). Measured peak for prod: 5.30 CPU / 5.62Gi requests,
  # 12.80 CPU / 12.38Gi limits. Set with roughly a third headroom on top, because
  # Jobs and CronJobs draw from the same quota and must not be starved by a
  # fully-scaled API — a migration that cannot schedule blocks a deploy.
  #
  # limits are quota-enforced too, and are deliberately far above requests: that
  # gap IS the burst capacity. Sizing limits equal to requests would remove the
  # headroom that makes limits worth setting.
  - target:
      kind: ResourceQuota
      name: vesselmind
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: '8'
      - op: replace
        path: /spec/hard/requests.memory
        value: 10Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: '20'
      - op: replace
        path: /spec/hard/limits.memory
        value: 20Gi
      # 20 api + 4 web + postgres + analytics + worker + batch, with room for a
      # rollout running old and new pods at once.
      - op: replace
        path: /spec/hard/pods
        value: '60'
