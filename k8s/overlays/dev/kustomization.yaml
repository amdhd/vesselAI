# Dev overlay — the local k3d cluster.
#
# This is where the load-testing settings live. They were previously in the base,
# which meant the "shared" definition carried a rate limit of two million
# requests. A base that quietly contains one environment's compromises is not a
# base; it is that environment with extra steps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vesselmind

resources:
  - ../../base

# Merged into the base ConfigMap by name.
patches:
  - target:
      kind: ConfigMap
      name: vesselmind-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      # Effectively unlimited, so k6 measures the application rather than the
      # rate limiter. Never do this in prod — see the prod overlay.
      - op: replace
        path: /data/API_RATE_LIMIT_MAX
        value: '2000000'
      - op: replace
        path: /data/API_RATE_LIMIT_WINDOW_MS
        value: '60000'

  # Smaller footprint: this shares a laptop with Prometheus, Grafana and Docker.
  # The resting pod count comes from the HPA's minReplicas below, NOT a replicas
  # field on the Deployment — the HPA owns /spec/replicas, and declaring it in
  # git makes Argo CD selfHeal fight the autoscaler (see 05-api-deployment.yaml).
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8

# Images: the base carries logical names; this maps them onto the local k3d
# registry that the cluster is wired to via `--registry-use`. Keeping the mapping
# here rather than in the base is what lets the same manifests target EKS, where
# this registry does not exist.
images:
  - name: vesselmind/api
    newName: k3d-vesselmind-registry:5111/vesselmind/api
    newTag: 0.5.1
  - name: vesselmind/web
    newName: k3d-vesselmind-registry:5111/vesselmind/web
    newTag: 0.2.0
  - name: vesselmind/analytics
    newName: k3d-vesselmind-registry:5111/vesselmind/analytics
    newTag: 0.3.0
  - name: vesselmind/migrate
    newName: k3d-vesselmind-registry:5111/vesselmind/migrate
    newTag: 0.3.0
  - name: vesselmind/warehouse-builder
    newName: k3d-vesselmind-registry:5111/vesselmind/warehouse-builder
    newTag: 0.3.0
