# Monitoring, on EKS.
#
# Exists for one reason: the Grafana Ingress in k8s/monitoring targets Traefik,
# which does not exist on EKS. Everything else about the monitoring stack is
# identical between clusters, so this overlay is deliberately thin — if it ever
# grows a second concern, that is a signal the base needs restructuring rather
# than this file needing more patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../../monitoring

patches:
  # Grafana's admin password, re-sealed against this cluster's key.
  #
  # k8s/monitoring/02-grafana-sealedsecret.yaml is encrypted to the k3d
  # controller, so on a fresh cluster grafana-secrets never appears and the pod
  # sits in CreateContainerConfigError — GF_SECURITY_ADMIN_PASSWORD references a
  # Secret that does not exist. Same failure mode as the app's secrets, missed on
  # the first pass because those were the obvious ones. EVERY SealedSecret in the
  # repo needs re-sealing per cluster, not just the ones in the app namespace.
  #
  # Generated by k8s/scripts/reseal-for-eks.sh.
  - path: grafana-sealedsecret-patch.yaml
    target:
      kind: SealedSecret
      name: grafana-secrets

  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: alb
      - op: add
        path: /spec/rules/0/host
        value: grafana.ahmadhadi.org
      - op: add
        path: /metadata/annotations
        value:
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          # SAME group as the app ingress. This is what keeps Grafana on the
          # shared ALB instead of provisioning a second one at ~$16/month.
          # The group is what makes host-based routing across three Ingress
          # objects land on one load balancer.
          alb.ingress.kubernetes.io/group.name: vesselmind
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
          alb.ingress.kubernetes.io/ssl-redirect: '443'
          # Grafana's own health endpoint. Unlike the app Ingress — where four
          # backends share one check and only `/` is common — this Ingress has a
          # single backend, so the check can be specific.
          alb.ingress.kubernetes.io/healthcheck-path: /api/health

      # SERVE AT THE ROOT OF ITS OWN HOSTNAME.
      #
      # The base serves Grafana under /grafana because k3d routes everything
      # through one localhost origin by path. Here it has a dedicated hostname,
      # so the prefix is redundant — grafana.ahmadhadi.org/grafana/login works
      # and grafana.ahmadhadi.org/ 404s, which is a confusing front door.
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /

  # Grafana must agree with the Ingress about where it lives. GF_SERVER_ROOT_URL
  # and SERVE_FROM_SUB_PATH are set for the k3d /grafana prefix in the base;
  # left unchanged, Grafana would keep generating /grafana/... links and
  # redirecting to a path the ALB no longer routes.
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: GF_SERVER_ROOT_URL
          value: https://grafana.ahmadhadi.org
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: 'false'
