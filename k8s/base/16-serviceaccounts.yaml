# One ServiceAccount per workload, with API tokens switched OFF.
#
# THE PROBLEM THIS FIXES. Every pod here ran as the namespace's `default`
# ServiceAccount, and Kubernetes mounts that account's token into every container
# by default — verified: /var/run/secrets/kubernetes.io/serviceaccount/token was
# present in the API pod. So the Express API, nginx and Postgres all carried a
# live Kubernetes API credential that none of them ever use. Compromise any one
# of them and the attacker gets a cluster credential for free.
#
# `automountServiceAccountToken: false` removes it. Nothing here talks to the
# Kubernetes API — the only workload in this project that legitimately does is
# Prometheus, which has its own ServiceAccount and a read-only ClusterRole.
#
# Distinct accounts per workload also mean audit logs name a workload rather than
# "default", and any future permission grant lands on one workload instead of
# everything in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: vesselmind
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: vesselmind
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: vesselmind
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics
  namespace: vesselmind
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: vesselmind
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch
  namespace: vesselmind
automountServiceAccountToken: false
---
# A Role scoped to ONE ConfigMap by name.
#
# Nothing currently needs this — it exists because "least privilege" is a claim
# worth being able to show rather than assert, and because `resourceNames` is the
# field that turns "can read configmaps" into "can read THIS configmap". Note
# resourceNames cannot restrict `list` or `watch` (they operate on collections),
# which is why only `get` is granted here — a detail people get wrong and end up
# granting far more than intended.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: vesselmind
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames: ['vesselmind-config']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-config-reader
  namespace: vesselmind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
subjects:
  - kind: ServiceAccount
    name: api
    namespace: vesselmind
