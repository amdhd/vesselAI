# Fleet Analytics: FastAPI over a DuckDB warehouse.
#
# THE ARCHITECTURAL DECISION, because it is a genuine fork and the image was
# built assuming the opposite.
#
# data-platform/Dockerfile.prod BAKES the warehouse into the image, deliberately:
# every replica ships its own copy, so the service scales horizontally with no
# shared volume and no writer coordination. That is a good design for data that
# only changes when you rebuild.
#
# But Phase 6 needs a CronJob that REFRESHES the warehouse, and nothing can write
# into an image. So the warehouse moves to a PersistentVolumeClaim: the CronJob
# writes it, this Deployment reads it.
#
# WHAT THAT COSTS, stated rather than discovered later:
#   - The PVC is ReadWriteOnce on local-path, so every pod touching it must be
#     scheduled on the volume's node. Kubernetes enforces that automatically via
#     volume node affinity, but the service can no longer spread across nodes and
#     cannot outlive that node.
#   - Readers hold an open file handle. When the CronJob replaces the file, pods
#     that are already running keep serving the OLD warehouse until restarted.
#     Correct behaviour (no torn reads), but it means "refreshed" data is not
#     visible until a rollout.
# The version that scales is object storage — write the warehouse to S3 and have
# replicas pull it — which is also what makes this work on EKS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warehouse
  namespace: vesselmind
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: vesselmind
spec:
  # ONE replica, and not by accident: see the RWO note above. Raising this only
  # works while every replica lands on the volume's node.
  replicas: 1
  selector:
    matchLabels:
      app: vesselmind-analytics
  template:
    metadata:
      labels:
        app: vesselmind-analytics
    spec:
      serviceAccountName: analytics
      automountServiceAccountToken: false
      securityContext:
        # The image creates uid 10001 and chowns /app to it.
        runAsNonRoot: true
        runAsUser: 10001
        # fsGroup makes the kubelet chgrp the volume on mount, so a non-root
        # process can actually write to a freshly-provisioned PVC. Without it,
        # the volume arrives root-owned and the initContainer below fails with
        # permission denied — a very common first-PVC surprise.
        fsGroup: 10001
      initContainers:
        # SEED THE EMPTY VOLUME. A new PVC is an empty directory, and mounting it
        # over the data directory HIDES the warehouse baked into the image — so
        # without this the API starts against a missing database file.
        #
        # Mounted at /seed rather than the data path precisely so the baked copy
        # stays visible to be copied FROM.
        #
        # Idempotent: it only copies when the file is absent, so a CronJob-built
        # warehouse is never overwritten by the stale baked one on pod restart.
        - name: seed-warehouse
          image: k3d-vesselmind-registry:5111/vesselmind/analytics:0.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -f /seed/vesselmind.duckdb ]; then
                echo "empty volume — seeding from the image's baked warehouse"
                cp /app/data-platform/data/vesselmind.duckdb /seed/vesselmind.duckdb
              else
                echo "warehouse already present ($(wc -c < /seed/vesselmind.duckdb) bytes) — leaving it alone"
              fi
          volumeMounts:
            - name: warehouse
              mountPath: /seed
      containers:
        - name: analytics
          image: k3d-vesselmind-registry:5111/vesselmind/analytics:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # api/main.py verifies the SAME app-issued JWT the Express backend
            # signs, so the two MUST share this secret. A mismatch produces 401s
            # on every analytics call while both services look perfectly healthy.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vesselmind-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              value: production
          volumeMounts:
            - name: warehouse
              mountPath: /app/data-platform/data
          # /health is unauthenticated by design, which is what makes it usable
          # as a probe — an authenticated health endpoint means giving the
          # kubelet a credential.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      volumes:
        - name: warehouse
          persistentVolumeClaim:
            claimName: warehouse
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: vesselmind
spec:
  type: ClusterIP
  selector:
    app: vesselmind-analytics
  ports:
    - name: http
      port: 8000
      targetPort: http
