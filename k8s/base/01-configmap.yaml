# Non-secret runtime config for the Express API.
# Read by backend/src/config/env.ts, which validates every one of these with zod
# at boot and calls process.exit(1) if any is wrong. A typo here is a
# CrashLoopBackOff, not a subtle runtime bug — that is deliberate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vesselmind-config
  namespace: vesselmind
data:
  # NODE_ENV is load-bearing, not cosmetic. Set to "development" DELIBERATELY,
  # and it is a temporary choice — flip it back in Phase 3.
  #
  # WHY: lib/jwtConfig.ts sets DEMO_LOGIN_ENABLED = NODE_ENV !== 'production'.
  # Under "production", demo@petronas.com / demo123 is rejected, and since no
  # migrations or seed have run yet there is no real account to log in with
  # either — the cluster would have no usable login at all.
  #
  # WHAT THIS COSTS, so it is on the record rather than discovered later:
  #   - DATABASE_URL stops being mandatory (config/env.ts only requires it under
  #     production), so a bad DB secret no longer fails fast at boot. The app
  #     boots and degrades quietly instead.
  #   - A JWT_SECRET under 32 chars stops being fatal. Ours is 47, so no change
  #     in practice, but the guardrail is off.
  #   - middleware/errorHandler.ts includes err.stack in API RESPONSES under
  #     development. Acceptable on a laptop, a real information leak anywhere else.
  #   - Logged-in vessel data comes from the in-memory fixtures in
  #     src/mock/vessels.ts, NOT from Postgres, because routes/fleet.ts falls
  #     back to mocks when fleet-001 is absent from the DB. Reads look right;
  #     writes do not persist. That is a fixture, not a database.
  #
  # THE REAL FIX, in Phase 3: run `prisma migrate deploy` then `prisma/seed.ts`,
  # which creates fleet-001, a genuine demo@petronas.com user (bcrypt'd
  # demo123) and 3 vessels IN POSTGRES. Then normal password login works, data
  # persists, and this goes back to "production".
  NODE_ENV: 'development'

  # The port the app binds. Must match containerPort in the Deployment and
  # targetPort in the Service. Three places, one number — a mismatch shows up as
  # a Service with healthy Endpoints that still refuses connections.
  PORT: '3001'

  # CORS origin. No frontend exists until Phase 4; this is a placeholder that
  # keeps the zod URL validation happy.
  FRONTEND_URL: 'http://localhost:5173'

  LOG_LEVEL: 'info'

  # Consumed by the Postgres container, not the API. Kept here (rather than in
  # the Secret) because a username and a database name are not secrets — only
  # the password is.
  POSTGRES_USER: 'vesselmind'
  POSTGRES_DB: 'vesselmind'
