# Non-secret runtime config for the Express API.
# Read by backend/src/config/env.ts, which validates every one of these with zod
# at boot and calls process.exit(1) if any is wrong. A typo here is a
# CrashLoopBackOff, not a subtle runtime bug — that is deliberate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vesselmind-config
  namespace: vesselmind
data:
  # NODE_ENV is load-bearing, not cosmetic. Back to "production" in Phase 3,
  # now that the db-init Job has migrated and seeded the database.
  #
  # WHAT THIS TURNS BACK ON:
  #   - DATABASE_URL is mandatory again (config/env.ts superRefine), so a bad or
  #     missing DB secret fails fast at boot instead of degrading silently.
  #   - JWT_SECRET under 32 chars is fatal again (lib/jwtConfig.ts).
  #   - Stack traces stop appearing in API responses (middleware/errorHandler.ts).
  #
  # WHAT IT TURNS OFF:
  #   - Demo login. DEMO_LOGIN_ENABLED is NODE_ENV !== 'production', so the
  #     hardcoded demo@petronas.com bypass is gone.
  #
  # That is now safe, and the reason is the whole point of this phase: the seed
  # created a REAL demo@petronas.com user in Postgres with a bcrypt-hashed
  # password. The same credentials still work — they just go through the normal
  # password path against a real row instead of a hardcoded bypass. Fleet data
  # comes from Postgres rather than the in-memory fixtures in src/mock/vessels.ts,
  # so edits persist.
  #
  # Consequence worth knowing: this ConfigMap now DEPENDS on the db-init Job
  # having run. On a fresh cluster, applying these manifests without running the
  # Job first leaves an API in production mode against an empty database, and
  # every login fails. The ordering is documented in docs/MIGRATIONS.md.
  NODE_ENV: 'production'

  # The port the app binds. Must match containerPort in the Deployment and
  # targetPort in the Service. Three places, one number — a mismatch shows up as
  # a Service with healthy Endpoints that still refuses connections.
  PORT: '3001'

  # CORS origin. No frontend exists until Phase 4; this is a placeholder that
  # keeps the zod URL validation happy.
  FRONTEND_URL: 'http://localhost:5173'

  LOG_LEVEL: 'info'

  # Consumed by the Postgres container, not the API. Kept here (rather than in
  # the Secret) because a username and a database name are not secrets — only
  # the password is.
  POSTGRES_USER: 'vesselmind'
  POSTGRES_DB: 'vesselmind'
