# The Express API as a Deployment.
#
# WHY A DEPLOYMENT AND NOT A STATEFULSET: the API holds nothing on disk and no
# per-instance identity. Any replica can serve any request, so interchangeable
# pods with rolling replacement is exactly right. (Two caveats that become real
# since the HPA took over replicas (2-8 pods) — Socket.io keeps connection state
# in-process, and express-rate-limit counts in per-pod memory, so the effective
# rate limit multiplies with every scale-up. Neither mattered at one replica.)
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Wave 2: after the db-init Job in wave 1. Starting before migrations have
    # run is the exact failure the Job exists to prevent.
    argocd.argoproj.io/sync-wave: '2'
  name: api
  namespace: vesselmind
spec:
  # NO spec.replicas HERE, ON PURPOSE — putting it back re-breaks the cluster.
  # Phase 8 enabled Argo CD selfHeal while this line still said replicas: 3
  # (patched to 2 in dev). The HPA owns the same field, so under load the two
  # controllers fought: the HPA scaled 2->5, Argo reverted it to the git value
  # within one reconciliation, the HPA scaled again — forever. Argo was doing
  # exactly what git told it to, and git contradicted the autoscaler. The Phase
  # 5 load-test numbers were not reproducible in the middle of that fight.
  #
  # The fix has two halves, and both are required:
  #   1. The field is gone, so git no longer contradicts the HPA. The resting
  #      pod count is now the HPA's minReplicas (2 in dev, 3 in prod — set in
  #      the overlays). The cost: a fresh cluster briefly starts at the
  #      Deployment default of 1 replica until the HPA's first sync.
  #   2. The Argo Application ignores /spec/replicas on this Deployment
  #      (k8s/argocd/01-application.yaml), so the HPA's live writes are not
  #      drift. Without half 2, the live object's replicas (set by the HPA)
  #      would differ from the rendered manifest and show OutOfSync forever;
  #      without half 1, Argo has a git value to revert TO.
  #
  # The two app-level caveats of the multi-replica world, flagged rather than
  # fixed:
  #   - express-rate-limit counts requests in per-pod memory, so the effective
  #     rate limit multiplies with every scale-up. A shared store (Redis) is
  #     the real fix.
  #   - Socket.io keeps connection state in-process. Without sticky sessions or
  #     a Redis adapter, a client whose requests land on different pods gets a
  #     broken handshake. Nothing depends on websockets yet, so it is latent.

  selector:
    matchLabels:
      app: vesselmind-api

  template:
    metadata:
      labels:
        app: vesselmind-api
    spec:
      # backend/src/server.ts HAS a SIGTERM handler (Phase 7) — it stops
      # accepting connections, drains in-flight requests, then exits. dumb-init
      # (PID 1 in the image) forwards the signal to it. This comment previously
      # said the handler did not exist, which was true when written and became
      # wrong once Phase 7 landed; a stale comment that describes a fixed gap is
      # worse than none, because a reviewer trusts it.
      #
      # 30s is the grace period the handler drains within. The remaining
      # subtlety is that endpoint removal and SIGTERM race: a pod can receive
      # traffic for a moment after it starts draining, which the handler
      # tolerates by finishing in-flight work rather than cutting it off.
      # TOPOLOGY SPREAD — what makes the PodDisruptionBudget in 18-pdb.yaml
      # mean something.
      #
      # Without this the scheduler is free to place every replica on ONE node.
      # A PDB saying "keep 1 available" cannot help if all of them share a
      # failure domain: drain that node and the budget blocks the drain forever
      # rather than protecting anything, and losing that node takes the whole
      # service regardless of replica count. Multi-node was chosen in Phase 1
      # precisely so anti-affinity and topology spread stop being theory; this
      # is that promise being kept.
      #
      # TWO DOMAINS, because they answer different failures:
      #   kubernetes.io/hostname       -> survives one NODE dying
      #   topology.kubernetes.io/zone  -> survives one AZ dying (EKS spans two)
      # On k3d the zone key is absent on every node, so that constraint is
      # simply inert locally — it does not need an overlay patch to be safe.
      #
      # whenUnsatisfiable: ScheduleAnyway, NOT DoNotSchedule. DoNotSchedule
      # makes spread a hard requirement, which means a rollout that cannot
      # satisfy it leaves pods Pending instead of degraded-but-running — and
      # with the HPA scaling to 20 replicas across 3 nodes, a strict maxSkew of
      # 1 is exactly the kind of constraint that deadlocks under load. Soft
      # spreading gets the availability win without inventing a new outage.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vesselmind-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vesselmind-api
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          # Restricts which syscalls the container may make, using the container
          # runtime's default profile. Required by PSS `restricted`, and one of
          # the cheapest real hardening wins available — it costs nothing and
          # blocks whole classes of kernel-surface attacks.
          type: RuntimeDefault
      serviceAccountName: api
      automountServiceAccountToken: false

      containers:
        - name: api
          # Built from backend/Dockerfile.prod (multi-stage, non-root `node`,
          # dumb-init PID 1, `node dist/server.js`). NOT backend/Dockerfile,
          # which is the dev image and expects a bind mount + ts-node-dev.
          #
          # An explicit version tag, never :latest. :latest makes rollouts
          # non-deterministic (you cannot tell which build is running) and is
          # precisely what Phase 2 break #1 exploits.
          image: vesselmind/api:0.5.1

          # PULLED FROM A REGISTRY, not side-loaded. Phase 4 replaced
          # `k3d image import` — which has no equivalent outside a laptop — with
          # a real registry running alongside the cluster. The hostname is how
          # the CLUSTER reaches it; from your shell the same registry is
          # localhost:5111. Two names, one registry, and confusing them is the
          # usual first error.
          #
          # IfNotPresent, not Always, because the tag is immutable by convention:
          # 0.1.0 always means this exact build, so re-pulling gains nothing.
          # With a mutable tag like :latest you would need Always — and would
          # then have no way to tell which build any given pod is running, which
          # is the whole argument against mutable tags.
          #
          # CI publishes to ghcr.io/amdhd/vesselai-api tagged with the commit
          # SHA. Switching this line to that image plus imagePullSecrets is all
          # that separates local from a real deployment. See docs/IMAGES.md.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001

          # envFrom pulls every key in the ConfigMap in as an env var. That is
          # fine for non-secret config where extra keys are harmless.
          envFrom:
            - configMapRef:
                name: vesselmind-config

          # Secrets are wired key-by-key rather than with envFrom, on purpose:
          # the mapping from Secret key -> env var is written down, so Phase 2
          # break #5 (rename a key) produces a diff you can actually read.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vesselmind-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vesselmind-secrets
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vesselmind-secrets
                  key: ANTHROPIC_API_KEY

          # PROBE SEMANTICS, AND AN HONEST LIMITATION.
          #
          # readiness = "should this pod receive traffic?" Failing removes it
          #             from the Service's Endpoints. Nothing is restarted.
          # liveness  = "is this process wedged?" Failing RESTARTS the
          #             container. An impatient liveness probe converts a slow
          #             start into a crash loop, which is why its thresholds are
          #             looser than readiness's below.
          #
          # THE LIMITATION: GET /api/health (backend/src/app.ts) returns
          # {status:'ok'} unconditionally and never touches the database. Prisma
          # connects lazily on first query, so this pod reports Ready with
          # Postgres completely down, takes traffic, and 500s it. A correct
          # readiness endpoint would run `SELECT 1` and fail closed. Worth
          # watching in Phase 2 break #6 — the pod will stay green while the
          # database is gone.
          # READINESS TESTS THE DEPENDENCY, liveness does not. /api/ready runs
          # SELECT 1 against Postgres; /api/health only proves the process is
          # answering. Pointing readiness at /api/health — as this did until now
          # — means a pod whose database is unreachable reports Ready, takes
          # traffic and 500s it. Worse, during a rolling update it lets
          # Kubernetes retire healthy old pods in favour of new ones that cannot
          # reach the database at all.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5

          # See the note in the StatefulSet: memory over limit = OOMKilled,
          # CPU over limit = throttled. requests are what the scheduler packs
          # against; with Docker Desktop on ~3.8GiB these are kept small on
          # purpose so Phase 4's extra pods still fit.
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m

          # The image already runs as the unprivileged `node` user; these make
          # that a hard guarantee rather than a convention.
          #
          # runAsUser IS REQUIRED HERE, and the reason is worth knowing.
          # runAsNonRoot makes the kubelet *verify* the user is not root before
          # starting the container — and it can only do that from a NUMERIC uid.
          # backend/Dockerfile.prod declares `USER node`, a name; the kubelet
          # does not read /etc/passwd inside the image, so it cannot resolve it
          # and refuses to start:
          #   Error: container has runAsNonRoot and image has non-numeric
          #   user (node), cannot verify user is non-root
          # The pod sits in CreateContainerConfigError — note that this is a
          # *config* failure, not a crash: no container ever ran, so
          # `kubectl logs` has nothing to show you. Only `describe` explains it.
          #
          # 1000 is the `node` user's real uid in node:20-alpine (verified with
          # `docker run --rm --entrypoint id vesselmind/api:0.5.1`), not a guess.
          #
          # ALTERNATIVE, arguably better: change the Dockerfile to
          # `USER 1000:1000`. An image intended for Kubernetes should declare a
          # numeric uid so this manifest does not have to restate it. Not done
          # here only because it edits the app image, which docker-compose.prod
          # also builds from. Worth doing later.
          #
          # readOnlyRootFilesystem is NOT set: Prisma and multer both write to
          # /tmp, so it needs an emptyDir mount to work. Left as a deliberate
          # gap rather than a silent one.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
