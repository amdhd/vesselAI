# Encrypted credentials — SAFE TO COMMIT TO A PUBLIC REPO.
#
# WHAT THIS IS
# Each value below is encrypted with a public key belonging to the
# sealed-secrets controller running in this cluster (kube-system). Only that
# controller holds the matching PRIVATE key, so only it can decrypt them. The
# ciphertext is useless to anyone who clones this repo.
#
# The controller watches for SealedSecret objects and, on seeing this one,
# creates an ordinary Kubernetes Secret named `vesselmind-secrets` in the
# `vesselmind` namespace. Nothing else in the project changes: the Deployment
# still reads a plain Secret via secretKeyRef and has no idea any of this
# happened.
#
# WHAT THIS DOES *NOT* PROTECT AGAINST — be precise about this in an interview.
# Sealing protects the REPOSITORY, not the cluster. Once the controller
# decrypts it, a normal Secret exists, and anyone with `kubectl get secret`
# permission in this namespace reads the values in one command. Restricting
# that is RBAC's job (Phase 7), not this file's.
#
# SCOPE: strict, the default. These values decrypt ONLY as a Secret named
# `vesselmind-secrets` in namespace `vesselmind`. Rename either and decryption
# fails — deliberately, so someone who copies this file into a namespace they
# do control cannot unseal it.
#
# THE OPERATIONAL TRAP, and it is a real one:
# The private key lives INSIDE the cluster. `k3d cluster delete` destroys it,
# the next controller generates a fresh key, and every value here becomes
# permanently undecryptable. We already rebuilt this cluster once. Either back
# the key up:
#
#   kubectl get secret -n kube-system \
#     -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > sealed-key.backup.yaml
#
# ...which is itself a plaintext private key and must NEVER be committed — or
# accept that a cluster rebuild means re-sealing from source values. For a
# throwaway local cluster, re-sealing is the honest answer. For a real cluster,
# losing that key is an incident.
#
# TO CHANGE A VALUE: edit a plaintext Secret locally, re-run
#   kubeseal --format yaml --controller-name sealed-secrets-controller \
#     --controller-namespace kube-system < plain.yaml > this-file.yaml
# and delete the plaintext. Never commit the plaintext.
#
# WHAT PRODUCTION WOULD DO INSTEAD: External Secrets Operator pulling from AWS
# Secrets Manager, with pod access granted by IRSA — no encrypted blob in git at
# all, and rotation handled outside the repo. That is Phase 9, once EKS exists.
#
# NOTE: the values sealed here are local-development credentials, not real ones.
# The encryption is the point, not the secrecy of these particular strings.
#
# Controller: bitnami-labs/sealed-secrets v0.38.4 (installed from the upstream
# plain-YAML release, no Helm — see the Environment section of the plan).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vesselmind-secrets
  namespace: vesselmind
spec:
  encryptedData:
    ANTHROPIC_API_KEY: 
    DATABASE_URL: 
    JWT_SECRET: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: vesselmind-secrets
      namespace: vesselmind
    type: Opaque
