# Serves the built SPA and reverse-proxies the API + websockets to the backend,
# so the browser talks to a single origin (no CORS). Runs under the
# nginx-unprivileged image (non-root, port 8080).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Fingerprinted build assets — safe to cache hard.
  #
  # NOTE: a location that sets any add_header stops inheriting the ones set at
  # server level, which is why the SPA's header block below is not relied on
  # here. Assets are subresources, not documents, so the only header that
  # matters on them is nosniff (CSP and Referrer-Policy are defined by the
  # loading document, not by a script/CSS response).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Analytics (FastAPI over the DuckDB gold layer) — a SEPARATE service from the
  # Express API below. nginx picks the longest matching prefix, so this wins over
  # `location /api/` and these requests never reach the Node backend (which has
  # no /api/analytics routes and would 404).
  location /api/analytics/ {
    proxy_pass http://analytics-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST API.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (the agent's streaming reasoning trace) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Socket.io realtime channel.
  location /socket.io/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # SPA fallback — client-side routing.
  #
  # Security headers live here, on the document response, rather than at server
  # level: the API locations below proxy to the Node backend, which already sets
  # its own via helmet, and inheriting a second CSP onto those responses would
  # just duplicate headers.
  #
  # The CSP is written for the actual bundle: scripts and workers are first-party
  # (Vite emits external modules — the built index.html has no inline script, so
  # 'unsafe-inline'/'unsafe-eval' are not needed); styles come from the app plus
  # the two external stylesheets in index.html (Google Fonts, unpkg's Leaflet
  # CSS); images include Leaflet's CDN markers and CARTO's map tiles; and
  # connect-src is locked to same-origin, which also stops a misconfigured
  # VITE_ANALYTICS_API_URL from pointing a deployed browser at localhost.
  #
  # 'unsafe-inline' is kept for style-src only. It is a deliberate first-rollout
  # concession (some chart/map code sets style attributes); it does not weaken
  # the script-src 'self' that is the point of the policy. HSTS omits
  # includeSubDomains so it cannot silently affect sibling hosts.
  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdnjs.cloudflare.com https://*.basemaps.cartocdn.com; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ /index.html;
  }
}
