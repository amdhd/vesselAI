# Production-style compose: multi-stage non-root images, migrations run as a
# one-off before the API starts, secrets supplied from the environment (never
# defaulted). Bring up with an env file that defines the required secrets:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Required in the env file: POSTGRES_PASSWORD, JWT_SECRET (>=32 chars),
# ANTHROPIC_API_KEY. See backend/.env.example for the full list.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vesselmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vesselmind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vesselmind}']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off: apply migrations against a fresh/updated DB, then exit. Uses the
  # `build` stage because it still has the Prisma CLI (pruned from runtime).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vesselmind}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vesselmind}
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: seed the demo fleet, user and vessels, then exit. Every write is an
  # upsert, so re-running on each deploy is safe.
  #
  # Without this a freshly migrated database has NO accounts, and demo login is
  # disabled in production (jwtConfig.ts) — so the credentials the login page
  # advertises would be rejected and the deployed app would be unusable. Seeding
  # means the normal password path works and there is fleet data to show.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: build
    command: npx ts-node prisma/seed.ts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vesselmind}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vesselmind}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-vesselmind}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vesselmind}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Behind the nginx frontend proxy → trust one hop so req.ip is the real client.
      TRUST_PROXY: '1'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  # Gold-layer serving API (FastAPI over DuckDB). Independent of Postgres and the
  # Express backend — it only reads the warehouse baked into its own image.
  analytics-api:
    build:
      context: ./data-platform
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      # Verifies the SAME app-issued JWT the Express backend signs, so the two
      # must share this secret. In production the API refuses to start on the
      # dev-only fallback, so this is required rather than defaulted.
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Same-origin: nginx proxies /api to the backend service.
        VITE_API_URL: /api
        # …and /api/analytics to the analytics service.
        VITE_ANALYTICS_API_URL: /
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - backend
      # nginx resolves proxy_pass hostnames at startup, so the analytics
      # container must exist or nginx fails with "host not found in upstream".
      - analytics-api

volumes:
  postgres_data:
